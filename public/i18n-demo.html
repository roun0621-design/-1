<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="app.name">Pace Rise</title>
    <style>
        body { font-family: system-ui, "Noto Sans KR", sans-serif; background:#f7f5f0; color:#1a1f2b; margin:0; padding:40px 20px; }
        .wrap { max-width: 560px; margin: 0 auto; }
        h1 { color:#1a1f2b; }
        .muted { color:#6b7280; }
        .card { background:#fff; border:1px solid #e5e1d6; border-radius:14px; padding:20px; margin:16px 0; }
        .row { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
        .chip { background:#1a1f2b; color:#f7f5f0; padding:6px 14px; border-radius:999px; font-weight:700; font-size:13px; }
        .chip.gold { background:#b79f58; color:#1a1f2b; }
        label { display:block; font-size:13px; color:#6b7280; margin-bottom:4px; }
        input { width:100%; box-sizing:border-box; padding:10px; border:1px solid #d8d2c4; border-radius:8px; }
        .hint { font-size:12px; color:#9ca3af; margin-top:24px; }
    </style>
</head>
<body>
    <div class="wrap">
        <h1 data-i18n="app.name">Pace Rise</h1>
        <p class="muted" data-i18n="home.subtitle">육상 경기 운영</p>

        <div class="card">
            <p data-i18n="home.competitions">대회 목록</p>
            <div class="row">
                <span class="chip" data-i18n="nav.dashboard">대시보드</span>
                <span class="chip" data-i18n="nav.results">결과확인</span>
                <span class="chip" data-i18n="nav.callroom">소집실</span>
                <span class="chip" data-i18n="nav.monitor">모니터</span>
                <span class="chip gold" data-i18n="nav.record">기록입력</span>
            </div>
            <div class="row">
                <span class="chip" data-i18n="common.male">남자</span>
                <span class="chip" data-i18n="common.female">여자</span>
                <span class="chip" data-i18n="common.mixed">혼성</span>
            </div>
            <div class="row">
                <span class="chip" data-i18n="round.prelim">예선</span>
                <span class="chip" data-i18n="round.semifinal">준결승</span>
                <span class="chip" data-i18n="round.final">결승</span>
            </div>
        </div>

        <div class="card">
            <label data-i18n="common.search">검색</label>
            <input type="text" data-i18n-ph="common.search" placeholder="검색">
        </div>

        <p class="hint">우측 상단 🌐 에서 KO / EN / JA 를 눌러보세요. 번역이 없는 텍스트는 한국어로 유지됩니다.</p>
    </div>

    <script src="/i18n.js?v=2"></script>
</body>
</html>
